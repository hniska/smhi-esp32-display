; ---------------------------------------------------------------------------
; PlatformIO build for the SMHI weather panel.
;
; The Arduino IDE route in README.md still works; this exists so the firmware
; can be compiled and version-pinned without a GUI.
;
;   pio run                 build (all envs)
;   pio run -e fnk0103_2p8_st7789 -t upload
;   pio device monitor
;
; Library versions are pinned to exactly what Freenove ships in their own
; Libraries/ folder. LVGL 9 has a different API and will NOT compile this code.
; ---------------------------------------------------------------------------
[platformio]
src_dir = SMHI_Display
default_envs = fnk0103_2p8_st7789

[common]
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino
monitor_speed = 115200

; No OTA here, so the default 1.3 MB app partition is wasted space. The 32 px
; font alone is ~140 kB of bitmap; on the default table the build lands at 92 %
; full and the next thing you add overflows it. huge_app gives 3 MB.
board_build.partitions = huge_app.csv

lib_deps =
  lvgl/lvgl@8.4.0
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.0.4

; Everything except the display driver, which each env picks below. Factored
; out rather than defined here and -U'd per env: PlatformIO mangles a `-U` that
; follows an interpolated flag list, and gcc then reports the useless
; "macro names must be identifiers".
build_flags =
  ; --- LVGL ---------------------------------------------------------------
  ; lvgl.h does #include "lv_conf.h" under this flag; include/ is on the
  ; default include path, which is where our lv_conf.h lives.
  -D LV_CONF_INCLUDE_SIMPLE
  -I include

  ; --- TFT_eSPI -----------------------------------------------------------
  ; Pins come verbatim from Freenove's TFT_eSPI_Setups/
  ; FNK0114B_2.8_240x320_ST7789.h. Setting USER_SETUP_LOADED here means the
  ; library never reads its own User_Setup.h, so nothing has to be edited
  ; inside the installed library — which is what makes this reproducible.
  -D USER_SETUP_LOADED=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_INVERSION_OFF=1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=80000000
  ; Panelens minnesläsning (0x2E) klarar inte skrivhastigheten. Utan den här
  ; raden läser TFT_eSPI i 80 MHz och readRect() returnerar skräp.
  -D SPI_READ_FREQUENCY=6000000
  -D USE_HSPI_PORT=1

; --- 2.4" och 2.8" ST7789 (pin-identiska) ----------------------------------
[env:fnk0103_2p8_st7789]
extends = common
build_flags =
  ${common.build_flags}
  -D ST7789_DRIVER=1

; --- 2.8" ILI9341 -----------------------------------------------------------
[env:fnk0103_2p8_ili9341]
extends = common
build_flags =
  ${common.build_flags}
  -D ILI9341_DRIVER=1

; --- Värdtester -------------------------------------------------------------
; pio test -e native
; Kör den rena logiken (sol, känsla, timtabellens rader) på datorn. Bara de
; filer som saknar Arduino- och LVGL-beroenden byggs.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<sun.cpp> +<detail.cpp>
build_flags = -std=gnu++17
